name: Build APK

# Runs on every push, and you can also start it by hand:
# GitHub repo -> Actions tab -> "Build APK" -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK and accepts its licences; Gradle downloads anything else it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew runnable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The smaller, faster build. If it ever fails, the debug APK above is still uploaded.
      - name: Build release APK
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: CritterQuest-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

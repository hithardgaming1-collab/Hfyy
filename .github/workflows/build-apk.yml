name: Build APK

# Runs on every push, and you can also start it by hand:
# GitHub repo -> Actions tab -> "Build APK" -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      # If you uploaded the .zip itself (GitHub does not unpack zips), this unpacks it here.
      # It then finds the folder that holds settings.gradle.kts and uses that as the project.
      - name: Find the project
        run: |
          if [ ! -f settings.gradle.kts ] && ls ./*.zip >/dev/null 2>&1; then
            for z in ./*.zip; do unzip -q -o "$z"; done
          fi
          f=$(find . -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ]; then
            echo "Could not find settings.gradle.kts - the project files are not in the repo."
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$f")"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK and accepts its licences; Gradle downloads anything else it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew runnable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      # The smaller, faster build. If it ever fails, the debug APK above is still uploaded.
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: CritterQuest-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

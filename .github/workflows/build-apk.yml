name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Find the project
        id: project
        run: |
          # If you uploaded the project as a zip file, open it first.
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -q -o "$z"; fi
          done
          echo "Files at the top of the repo:"
          ls -la
          found=$(find . -name settings.gradle.kts -not -path "./.git/*" | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d" " -f2-)
          if [ -z "$found" ]; then
            echo "ERROR: settings.gradle.kts was not found. The project files are not in this repo, or not in the right place."
            exit 1
          fi
          dir=$(dirname "$found")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build the APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --console=plain

      - name: Save the APK
        uses: actions/upload-artifact@v7
        with:
          name: CritterQuest-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
